l_english:
 # Decision category for the Necrotech research projects
 zombie_research_category:0 "Necrotech Research"
 zombie_research_category_desc:0 "Our Reanimation Laboratory can raise the dead and turn them into soldiers. Each project takes time and political power, and the laboratory works on one project at a time. While a project runs, the scientists it borrows slow our other research by 5%."
 zombie_lab_free_tt:0 "The Reanimation Laboratory is not busy with another project"

 # Units
 zombie_horde:0 "Zombie Horde"
 zombie_horde_desc:0 "A shambling mass of reanimated soldiers. They need little manpower, train quickly, never panic and hit hard in close quarters, but they are poorly organised and useless for keeping order behind the lines."
 zombie_brute:0 "Zombie Brutes"
 zombie_brute_desc:0 "Huge, stitched-together monstrosities bred for breaking enemy lines. Slow and clumsy, but devastating once they reach the trenches."
 infected_hounds:0 "Infected Hounds"
 infected_hounds_desc:0 "Packs of infected dogs that range ahead of the horde and sniff out the living. Improves the division's reconnaissance."

 # Equipment
 zombie_serum_equipment:0 "Reanimation Serum"
 zombie_serum_equipment_short:0 "Serum"
 zombie_serum_equipment_desc:0 "Doses of reanimation serum, plus the restraints and cages needed to keep the subjects pointed at the enemy. Zombie battalions are equipped with serum instead of rifles."
 zombie_serum_equipment_1:0 "Reanimation Serum I"
 zombie_serum_equipment_1_short:0 "Serum I"
 zombie_serum_equipment_1_desc:0 "An unstable first batch. The dead rise, slowly and not for long."
 zombie_serum_equipment_2:0 "Reanimation Serum II"
 zombie_serum_equipment_2_short:0 "Serum II"
 zombie_serum_equipment_2_desc:0 "A stabilised formula that keeps the reanimated fighting for much longer."
 zombie_serum_equipment_3:0 "Reanimation Serum III"
 zombie_serum_equipment_3_short:0 "Serum III"
 zombie_serum_equipment_3_desc:0 "The perfected formula. Its subjects are fast, strong and hungry."

 # Technologies
 zombie_reanimation:0 "Reanimation Experiments"
 zombie_reanimation_desc:0 "Our scientists have found a way to make the dead walk again. Unlocks the Zombie Horde battalion and Reanimation Serum I."
 zombie_virulent_strain:0 "Virulent Strain"
 zombie_virulent_strain_desc:0 "A more aggressive strain of the reanimation agent makes our zombies attack with reckless fury."
 zombie_necrotic_brutes:0 "Necrotic Brutes"
 zombie_necrotic_brutes_desc:0 "By stitching several bodies together we can create brutes able to smash through enemy lines. Unlocks the Zombie Brutes battalion."
 zombie_bone_plating:0 "Bone Plating"
 zombie_bone_plating_desc:0 "Ossified armour plates grown under the skin make our zombies much harder to put down."
 zombie_stabilised_serum:0 "Stabilised Serum"
 zombie_stabilised_serum_desc:0 "A stabilised formula keeps reanimated soldiers fighting for longer. Unlocks Reanimation Serum II."
 zombie_relentless_hunger:0 "Relentless Hunger"
 zombie_relentless_hunger_desc:0 "Heightening the subjects' hunger means they keep advancing whatever happens around them."
 zombie_perfected_serum:0 "Perfected Serum"
 zombie_perfected_serum_desc:0 "The final version of the serum produces fast, strong zombies. Unlocks Reanimation Serum III."
 zombie_apex_strain:0 "Apex Strain"
 zombie_apex_strain_desc:0 "The ultimate reanimation agent turns every subject into an apex predator."
 zombie_infected_hounds:0 "Infected Hounds"
 zombie_infected_hounds_desc:0 "The agent works on animals too. Infected dogs make excellent scouts. Unlocks the Infected Hounds support company."
 zombie_pack_hunters:0 "Pack Hunters"
 zombie_pack_hunters_desc:0 "Training the hounds to hunt in packs makes them faster, more dangerous and better at finding the enemy."

 # Research projects (decisions)
 zombie_research_reanimation:0 "Research: Reanimation Experiments"
 zombie_research_reanimation_desc:0 "Unlocks the §YZombie Horde§! battalion and §YReanimation Serum I§!."
 zombie_research_virulent_strain:0 "Research: Virulent Strain"
 zombie_research_virulent_strain_desc:0 "Zombie Hordes and Brutes: §G+10%§! soft attack and breakthrough. Infected Hounds: §G+10%§! soft attack."
 zombie_research_stabilised_serum:0 "Research: Stabilised Serum"
 zombie_research_stabilised_serum_desc:0 "Unlocks §YReanimation Serum II§!."
 zombie_research_infected_hounds:0 "Research: Infected Hounds"
 zombie_research_infected_hounds_desc:0 "Unlocks the §YInfected Hounds§! support company."
 zombie_research_necrotic_brutes:0 "Research: Necrotic Brutes"
 zombie_research_necrotic_brutes_desc:0 "Unlocks the §YZombie Brutes§! battalion."
 zombie_research_relentless_hunger:0 "Research: Relentless Hunger"
 zombie_research_relentless_hunger_desc:0 "All zombie units: §G+5§! organisation. Hordes and Brutes also recover organisation faster."
 zombie_research_pack_hunters:0 "Research: Pack Hunters"
 zombie_research_pack_hunters_desc:0 "Infected Hounds: §G+1§! recon, §G+20%§! soft attack, §G+10%§! speed."
 zombie_research_bone_plating:0 "Research: Bone Plating"
 zombie_research_bone_plating_desc:0 "Zombie Hordes: §G+10%§! defense. Zombie Brutes: §G+20%§! defense, §G+10%§! breakthrough."
 zombie_research_perfected_serum:0 "Research: Perfected Serum"
 zombie_research_perfected_serum_desc:0 "Unlocks §YReanimation Serum III§!."
 zombie_research_apex_strain:0 "Research: Apex Strain"
 zombie_research_apex_strain_desc:0 "Zombie Hordes and Brutes: §G+15%§! soft attack, §G+10%§! breakthrough, §G+10§! organisation, §G+10%§! speed. Infected Hounds: §G+10§! organisation."
